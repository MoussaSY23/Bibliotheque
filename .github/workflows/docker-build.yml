name: Build and Push Docker Image

on:
  push:
    branches:
      - Sy_Moussa_librairie  # Remplace par la branche souhaitée
  pull_request:
    branches:
      - Sy_Moussa_librairie  # Remplace par la branche souhaitée

jobs:
  build:
    runs-on: ubuntu-latest  # Exécute le workflow sur un environnement Ubuntu

    steps:
      # Étape 1 : Vérifier le code du dépôt
      - name: Checkout repository
        uses: actions/checkout@v2

      # Étape 2 : Configurer Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Étape 3 : Se connecter à Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Étape 4 : Construire l'image Docker
      - name: Build Docker image
        run: |
          docker build -t MoussaSY23/librairie:latest .

      # Étape 5 : Pousser l'image Docker vers Docker Hub
      - name: Push Docker image
        run: |
          docker push MoussaSY23/librairie:latest
